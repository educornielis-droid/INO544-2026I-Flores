<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FloreScope · Detector de Flores</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #e8e0d5;
            font-family: 'Georgia', 'Times New Roman', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 560px;
            width: 100%;
            background: #fffef7;
            border-radius: 32px;
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            padding: 32px 30px 40px;
            border: 1px solid #e2dcd0;
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 600;
            color: #5c4b3a;
            font-family: 'Georgia', serif;
        }

        .header h1 span {
            background: linear-gradient(135deg, #8b6b4d, #b8956e);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .sub {
            font-size: 0.7rem;
            color: #b0a088;
            margin-top: 8px;
            letter-spacing: 1.5px;
            font-family: 'Courier New', monospace;
        }

        .image-area {
            background: #faf6ef;
            border-radius: 28px;
            padding: 20px;
            text-align: center;
            border: 1px solid #e8dfd0;
            margin-bottom: 20px;
        }

        .preview-box {
            background: #f5efe7;
            border-radius: 24px;
            min-height: 230px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid #e0d5c5;
        }

        .preview-box img, .preview-box video {
            max-width: 100%;
            max-height: 210px;
            object-fit: contain;
            border-radius: 16px;
        }

        .placeholder-icon {
            text-align: center;
            color: #c9bcab;
            padding: 45px;
        }

        .placeholder-icon span {
            font-size: 52px;
        }

        .btn-change {
            background: none;
            border: none;
            color: #9b7b5c;
            font-weight: 600;
            font-size: 0.8rem;
            margin-top: 14px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .result-box {
            text-align: center;
            margin-bottom: 25px;
        }

        .status {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .status.flor { color: #7d6b3c; }
        .status.no-flor { color: #b57c6e; }

        .confidence-max {
            font-size: 2.2rem;
            font-weight: 600;
            color: #5c4b3a;
            margin: 12px 0 5px;
        }

        .confidence-label {
            font-size: 0.65rem;
            color: #bcab95;
            letter-spacing: 1.5px;
            margin-bottom: 15px;
        }

        .confidence-bar-container {
            background: #e8dfd0;
            border-radius: 60px;
            height: 8px;
            overflow: hidden;
            margin: 15px 0;
        }

        .confidence-bar {
            background: linear-gradient(90deg, #c9a87b, #8b6b4d);
            width: 0%;
            height: 100%;
            border-radius: 60px;
            transition: width 0.3s ease;
        }

        .threshold {
            font-size: 0.65rem;
            color: #bcab95;
            margin-top: 8px;
        }

        .meter {
            background: #f0e9df;
            border-radius: 60px;
            padding: 6px;
            display: flex;
            margin: 25px 0 20px;
            position: relative;
        }

        .meter-option {
            flex: 1;
            text-align: center;
            font-size: 0.8rem;
            font-weight: 500;
            padding: 8px;
            border-radius: 50px;
            z-index: 1;
            color: #8f7a63;
        }

        .meter-indicator {
            position: absolute;
            top: 6px;
            bottom: 6px;
            width: calc(50% - 6px);
            background: #fffef7;
            border-radius: 50px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            transition: left 0.3s ease;
            left: 6px;
            border: 1px solid #e0d5c5;
        }

        .meter-option.active { color: #5c4b3a; font-weight: 600; }

        .justification {
            background: #faf6ef;
            border-radius: 24px;
            padding: 18px 22px;
            font-size: 0.85rem;
            color: #6b5a48;
            line-height: 1.5;
            margin: 20px 0;
            text-align: center;
            border: 1px solid #ece2d5;
        }

        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }

        .btn {
            flex: 1;
            padding: 14px 0;
            border: none;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: #dccfbc;
            color: #5c4b3a;
        }

        .btn-primary:hover { background: #cdbdab; }

        .btn-outline {
            background: #fffef7;
            color: #9b7b5c;
            border: 1px solid #dccfbc;
        }

        .btn-outline:hover { background: #faf6ef; }

        .oculto { display: none; }
        video { width: 100%; max-height: 220px; background: #e8dfd0; border-radius: 16px; }
        canvas { display: none; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🌼 <span>FloreScope</span></h1>
        <div class="sub">DETECTOR DE FLORES · MODELO ONNX · INO-544</div>
    </div>

    <div class="image-area">
        <div class="preview-box" id="previewBox">
            <div class="placeholder-icon" id="placeholderIcon">
                <span>🌻</span>
                <p>Esperando imagen</p>
            </div>
            <video id="videoCamara" autoplay playsinline style="display:none;"></video>
            <img id="imgPreview" class="oculto" alt="Vista previa">
            <canvas id="canvasCapture" style="display:none;"></canvas>
        </div>
        <button class="btn-change" id="btnChangeImage">📁 Cambiar imagen</button>
        <input type="file" id="fileInput" accept="image/jpeg,image/png,image/jpg" style="display:none;">
    </div>

    <div class="result-box">
        <div class="status" id="statusText">NO RECONOCIDO</div>
        <div class="confidence-max" id="confidenceValue">0.0%</div>
        <div class="confidence-label">CONFIANZA MÁXIMA</div>
        <div class="confidence-bar-container">
            <div class="confidence-bar" id="confidenceBar"></div>
        </div>
        <div class="threshold">⚖️ UMBRAL DE DECISIÓN · 50%</div>
    </div>

    <div class="meter" id="meter">
        <div class="meter-indicator" id="meterIndicator"></div>
        <div class="meter-option" id="meterNoFlor">No es flor</div>
        <div class="meter-option" id="meterFlor">Es flor</div>
    </div>

    <div class="justification" id="justificationText">Esperando análisis...</div>

    <div class="buttons">
        <button class="btn btn-outline" id="btnAnalyzeImage">📷 Analizar imagen</button>
        <button class="btn btn-primary" id="btnCamara">🎥 Cámara</button>
    </div>
</div>

<script>
    const video = document.getElementById('videoCamara');
    const canvas = document.getElementById('canvasCapture');
    const ctx = canvas.getContext('2d');
    const imgPreview = document.getElementById('imgPreview');
    const placeholderIcon = document.getElementById('placeholderIcon');
    const fileInput = document.getElementById('fileInput');
    const btnChangeImage = document.getElementById('btnChangeImage');
    const btnAnalyzeImage = document.getElementById('btnAnalyzeImage');
    const btnCamara = document.getElementById('btnCamara');
    const statusText = document.getElementById('statusText');
    const confidenceValue = document.getElementById('confidenceValue');
    const confidenceBar = document.getElementById('confidenceBar');
    const meterIndicator = document.getElementById('meterIndicator');
    const meterNoFlor = document.getElementById('meterNoFlor');
    const meterFlor = document.getElementById('meterFlor');
    const justificationText = document.getElementById('justificationText');

    let modo = 'imagen';
    let streamActivo = null;
    let intervaloDeteccion = null;

    function actualizarUI(esFlor, confianza) {
        const pct = (confianza * 100).toFixed(1);
        confidenceValue.innerHTML = `${pct}%`;
        confidenceBar.style.width = `${pct}%`;

        if (esFlor) {
            statusText.innerHTML = '✅ RECONOCIDO';
            statusText.className = 'status flor';
            justificationText.innerHTML = `🌸 Flor detectada con ${pct}% de confianza.`;
            meterIndicator.style.left = 'calc(50% + 6px)';
            meterNoFlor.classList.remove('active');
            meterFlor.classList.add('active');
        } else {
            statusText.innerHTML = '❌ NO RECONOCIDO';
            statusText.className = 'status no-flor';
            justificationText.innerHTML = `🌿 No es flor. Confianza: ${(100-pct).toFixed(1)}%`;
            meterIndicator.style.left = '6px';
            meterNoFlor.classList.add('active');
            meterFlor.classList.remove('active');
        }
    }

    async function enviarImagen(base64Data) {
        try {
            const response = await fetch('/analizar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ imagen: base64Data })
            });
            const data = await response.json();
            actualizarUI(data.es_flor, data.confianza);
        } catch (err) {
            justificationText.innerHTML = '⚠️ Error al conectar con el servidor.';
        }
    }

    function analizarFrameVideo() {
        if (!video.videoWidth) return;
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0);
        enviarImagen(canvas.toDataURL('image/jpeg'));
    }

    async function iniciarCamara() {
        if (streamActivo) return;
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            streamActivo = stream;
            video.srcObject = stream;
            video.style.display = 'block';
            placeholderIcon.classList.add('oculto');
            imgPreview.classList.add('oculto');
            await video.play();
            if (intervaloDeteccion) clearInterval(intervaloDeteccion);
            intervaloDeteccion = setInterval(analizarFrameVideo, 500);
        } catch (err) {
            justificationText.innerHTML = '❌ No se pudo acceder a la cámara.';
        }
    }

    function detenerCamara() {
        if (intervaloDeteccion) clearInterval(intervaloDeteccion);
        if (streamActivo) {
            streamActivo.getTracks().forEach(track => track.stop());
            streamActivo = null;
            video.srcObject = null;
        }
        video.style.display = 'none';
    }

    function activarModoImagen() {
        detenerCamara();
        modo = 'imagen';
        placeholderIcon.classList.remove('oculto');
        video.style.display = 'none';
        if (imgPreview.src && !imgPreview.classList.contains('oculto')) {
            enviarImagen(imgPreview.src);
        } else {
            actualizarUI(false, 0);
        }
    }

    fileInput.addEventListener('change', (e) => {
        if (e.target.files && e.target.files[0]) {
            const reader = new FileReader();
            reader.onload = (ev) => {
                const base64 = ev.target.result;
                imgPreview.src = base64;
                imgPreview.classList.remove('oculto');
                placeholderIcon.classList.add('oculto');
                detenerCamara();
                modo = 'imagen';
                enviarImagen(base64);
            };
            reader.readAsDataURL(e.target.files[0]);
        }
    });

    btnChangeImage.addEventListener('click', () => fileInput.click());
    btnAnalyzeImage.addEventListener('click', () => { detenerCamara(); fileInput.click(); });
    btnCamara.addEventListener('click', () => {
        if (modo === 'camara' && streamActivo) return;
        detenerCamara();
        modo = 'camara';
        imgPreview.classList.add('oculto');
        placeholderIcon.classList.add('oculto');
        iniciarCamara();
    });

    activarModoImagen();
</script>
</body>
</html>
